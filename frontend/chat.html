<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <meta name="description" content="Chat com assistente de IA">
  <title>Chat IA - Ingresso Universitário</title>
  <script src="https://cdn.tailwindcss.com"></script>
  <script>
    tailwind.config = {
      theme: {
        extend: {
          fontFamily: { sans: ['Inter', 'ui-sans-serif', 'system-ui'] }
        }
      }
    }
  </script>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet" charset="utf-8">
  <link rel="stylesheet" href="css/estilo.css">
</head>
<body class="font-sans antialiased bg-gray-50 min-h-screen">

  <!-- Botão flutuante do chat -->
  <div id="chat-flutuante" class="fixed bottom-6 right-6 flex flex-col gap-2 z-50">
    <!-- Botão principal -->
    <button id="btn-abrir-chat" class="bg-indigo-600 text-white rounded-full p-3 shadow-lg hover:bg-indigo-700 transition">
      <svg class="w-6 h-6" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
        <path d="M21 15a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2V3a2 2 0 0 1 2-2h11l5 5v5a2 2 0 0 1-2 2z"/>
        <polyline points="17 8 12 15 7 8"/>
      </svg>
    </button>

    <!-- Contador de mensagens (opcional) -->
    <span id="contador-mensagens" class="text-xs text-white bg-indigo-500 rounded-full w-5 h-5 flex items-center justify-center opacity-0 transition">0</span>
  </div>

  <!-- Painel do chat -->
  <div id="painel-chat" class="fixed bottom-6 right-6 w-80 max-w-xs bg-white rounded-2xl shadow-2xl z-50 hidden flex-flex-col">
    <!-- Cabeçalho -->
    <div class="flex items-center justify-between p-4 border-b rounded-t-2xl bg-indigo-50">
      <div class="flex items-center gap-3">
        <div class="w-10 h-10 rounded-lg bg-indigo-100 flex items-center justify-center">
          <svg class="w-5 h-5 text-indigo-600" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
            <circle cx="12" cy="12" r="10"/>
            <path d="M8 14s1.5 2 4 2 4-2 4-2"/>
            <line p1="9" p2="9" x1="1" x2="23"/>
            <line p1="15" p2="15" x1="1" x2="23"/>
          </svg>
        </div>
        <span class="font-bold text-lg">Assistente IA</span>
      </div>
      <button id="btn-fechar-chat" class="text-gray-400 hover:text-gray-600 p-1">
        <svg class="w-5 h-5" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
          <line x1="18" y1="6" x2="6" y2="18"/>
          <line x1="6" y1="6" x2="18" y2="18"/>
        </svg>
      </button>
    </div>

    <!-- Área de mensagens -->
    <div id="area-mensagens" class="flex-1 overflow-y-auto p-4 space-y-3" style="max-height: 400px;">
      <!-- Mensagens aparecem aqui -->
      <div id="mensagem-vazio" class="text-center py-8 text-gray-400">
        <svg class="w-12 h-12 mx-auto mb-3 opacity-50" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
          <path d="M21 15a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2V3a2 2 0 0 1 2-2h11l5 5v5a2 2 0 0 1-2 2z"/>
          <polyline points="17 8 12 15 7 8"/>
        </svg>
        <p>Inicie uma conversa</p>
      </div>
    </div>

    <!-- Área de input -->
    <div class="p-4 border-t pt-3">
      <form id="form-mensagem" class="flex gap-2">
        <input type="text" id="input-mensagem" placeholder="Digite uma mensagem..." 
          class="flex-1 rounded-lg border px-3 py-2 focus:outline-none focus:ring-2 focus:ring-indigo-500"
          autocomplete="off"
          maxlength="500">
        <button type="submit" class="bg-indigo-600 text-white rounded-lg px-4 py-2 hover:bg-indigo-700 transition">
          Enviar
        </button>
      </form>
    </div>
  </div>

  <script src="js/util.js"></script>
  <script src="js/chat.js"></script>
  <script>
    // Elementos do DOM
    const btnFlutuante = document.getElementById('chat-flutuante')
    const painelChat = document.getElementById('painel-chat')
    const btnFechar = document.getElementById('btn-fechar-chat')
    const btnAbrir = document.getElementById('btn-abrir-chat')
    const formMensagem = document.getElementById('form-mensagem')
    const inputMensagem = document.getElementById('input-mensagem')
    const areaMensagens = document.getElementById('area-mensagens')
    const mensagemVazio = document.getElementById('mensagem-vazio')
    const contador = document.getElementById('contador-mensagens')

    // Alternar painel
    btnAbrir.addEventListener('click', () => {
      painelChat.classList.remove('hidden')
      painelChat.classList.add('flex')
      // Focar no input após breve delay
      setTimeout(() => inputMensagem.focus(), 100)
    })

    btnFechar.addEventListener('click', () => {
      painelChat.classList.add('hidden')
      painelChat.classList.remove('flex')
    })

    // Fechar ao clicar fora do painel
    btnFlutuante.addEventListener('click', (e) => {
      if (e.target === btnFlutuante || e.target.closest('#chat-flutuante')) {
        painelChat.classList.toggle('hidden')
        painelChat.classList.toggle('flex')
      }
    })

    // Enviar mensagem
    formMensagem.addEventListener('submit', async (e) => {
      e.preventDefault()
      const texto = inputMensagem.value.trim()
      if (!texto) return

      // Adicionar mensagem do usuário
      adicionarMensagem(texto, true)
      contador.textContent = parseInt(contador.textContent || '0') + 1
      inputMensagem.value = ''

      // Mostrar indicador de digitação
      mostrarDigitando()

      try {
        const resposta = await fetch('/api/groq-chat', {
          method: 'POST',
          headers: {
            'Content-Type': 'application/json'
          },
          body: JSON.stringify({ mensagem: texto })
        })
        const dados = await resposta.json()
        
        removerDigitando()
        
        if (resposta.ok && dados.sucesso) {
          adicionarMensagem(dados.resposta || 'Sem resposta', false)
          contador.textContent = parseInt(contador.textContent || '0') + 1
        } else {
          adicionarMensagem('Desculpe, ocorreu um erro. Tente novamente.', false)
        }
      } catch (erro) {
        removerDigitando()
        adicionarMensagem('Sem conexão com a API. Verifique se o servidor está rodando.', false)
      }
    })

    // Funções auxiliares
    function adicionarMensagem(texto, isUser) {
      const div = document.createElement('div')
      div.className = `p-3 rounded-lg max-w-[80%] ${
        isUser ? 'bg-indigo-600 text-white ml-auto' : 'bg-gray-200 text-gray-800 mr-auto'
      }`
      div.textContent = texto
      areaMensagens.appendChild(div)
      areaMensagens.scrollTop = areaMensagens.scrollHeight
    }

    function mostrarDigitando() {
      if (document.getElementById('bot-digitando')) return
      const div = document.createElement('div')
      div.id = 'bot-digitando'
      div.className = 'p-3 rounded-lg bg-gray-200 text-gray-800 mr-auto max-w-[80%] mb-2'
      div.innerHTML = '<span class="text-sm">Bot está digitando...</span>'
      areaMensagens.appendChild(div)
      areaMensagens.scrollTop = areaMensagens.scrollHeight
    }

    function removerDigitando() {
      const elemento = document.getElementById('bot-digitando')
      if (elemento) elemento.remove()
    }

    // Verificar se há mensagens salvas no localStorage
    const mensagensSalvas = JSON.parse(localStorage.getItem('chat-mensagens') || '[]')
    if (mensagensSalvas.length > 0) {
      mensagemVazio.classList.add('hidden')
      mensagemVazio.classList.remove('block')
      mensagensSalvas.forEach(m => {
        const div = document.createElement('div')
        div.className = `p-3 rounded-lg max-w-[80%] ${
          m.isUser ? 'bg-indigo-600 text-white ml-auto' : 'bg-gray-200 text-gray-800 mr-auto'
        }`
        div.textContent = m.texto
        areaMensagens.appendChild(div)
      })
      areaMensagens.scrollTop = areaMensagens.scrollHeight
    }
  </script>
</body>
</html>
