<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <meta name="description" content="Detalhes do curso: notas de corte, custos da cidade, bolsas, auxílios e mercado de trabalho.">
  <title>Detalhes do Curso — Ingresso Universitário</title>
  <script src="https://cdn.tailwindcss.com"></script>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&display=swap" rel="stylesheet" charset="utf-8">
  <link rel="stylesheet" href="../css/estilo.css">
  <script>
    tailwind.config = {
      theme: {
        extend: {
          fontFamily: { sans: ['Inter', 'ui-sans-serif', 'system-ui'] }
        }
      }
    }
  </script>
</head>
<body class="font-sans antialiased text-gray-800 bg-gray-50 min-h-screen flex flex-col">

  <div id="navbar"></div>

  <main class="flex-1 pt-16 pb-16">
    <div class="max-w-6xl mx-auto px-4">

      <!-- Skeleton durante o carregamento (RNF2) -->
      <div id="detalheSkeleton" class="py-10">
        <div class="space-y-4">
          <div class="skeleton h-4 w-24 rounded"></div>
          <div class="skeleton h-10 w-2/3 rounded"></div>
          <div class="skeleton h-4 w-1/2 rounded"></div>
          <div class="skeleton h-4 w-1/3 rounded"></div>
        </div>
      </div>

      <!-- Cabeçalho do curso -->
      <section id="cabecalhoCurso" class="hidden bg-gradient-to-br from-indigo-50 via-white to-white rounded-3xl ring-1 ring-gray-200 p-6 md:p-10 shadow-sm mt-6"></section>

      <!-- Abas com os detalhes RF2–RF5 -->
      <section id="conteudoDetalhe" class="hidden mt-10">
        <div class="border-b border-gray-200 bg-white rounded-t-2xl px-2" role="tablist" aria-label="Informações do curso" aria-orientation="horizontal">
          <div class="barra-guias flex overflow-x-auto">
            <button type="button" role="tab" aria-selected="true" aria-controls="atmNotas" id="guia-notas"
              class="guia px-4 md:px-6 py-4 text-sm font-medium whitespace-nowrap">Notas de corte</button>
            <button type="button" role="tab" aria-selected="false" aria-controls="atmCustos" id="guia-custos" tabindex="-1"
              class="guia px-4 md:px-6 py-4 text-sm font-medium whitespace-nowrap">Custos da cidade</button>
            <button type="button" role="tab" aria-selected="false" aria-controls="atmBolsas" id="guia-bolsas" tabindex="-1"
              class="guia px-4 md:px-6 py-4 text-sm font-medium whitespace-nowrap">Bolsas e auxílios</button>
            <button type="button" role="tab" aria-selected="false" aria-controls="atmMercado" id="guia-mercado" tabindex="-1"
              class="guia px-4 md:px-6 py-4 text-sm font-medium whitespace-nowrap">Mercado e estágios</button>
          </div>
        </div>

        <div class="bg-gray-50 rounded-b-2xl ring-1 ring-gray-200 p-5 md:p-8">
          <section id="atmNotas" role="tabpanel" aria-labelledby="guia-notas"></section>
          <section id="atmCustos" role="tabpanel" aria-labelledby="guia-custos" hidden></section>
          <section id="atmBolsas" role="tabpanel" aria-labelledby="guia-bolsas" hidden></section>
          <section id="atmMercado" role="tabpanel" aria-labelledby="guia-mercado" hidden></section>
        </div>
      </section>

    </div>
  </main>

  <footer class="bg-gray-900 text-gray-400 text-center py-8 px-4">
    <p class="text-sm">© 2026 Ingresso Universitário — Projeto Integrador I · Grupo 3</p>
  </footer>

  <script src="../js/util.js"></script>
  <script src="../js/api.js"></script>
  <script src="../js/dadosDemo.js"></script>
  <script src="../js/componentes.js"></script>
  <script src="../js/favoritos.js"></script>
  <script src="../js/detalhes.js"></script>
</body>
</html>
