<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
  <meta name="theme-color" content="#143f8f">
  <meta name="description" content="Detalhes do curso: notas de corte, custos da cidade, bolsas, auxílios e mercado de trabalho." data-i18n-content="meta.detalhes.descricao">
  <title data-i18n="meta.detalhes.titulo">Detalhes do Curso — Ingresso Universitário</title>
  <script>
    (function () {
      try {
        var tema = localStorage.getItem('ingresso_tema')
        if (!tema) tema = window.matchMedia('(prefers-color-scheme: dark)').matches ? 'dark' : 'light'
        document.documentElement.dataset.theme = tema
      } catch (erro) { document.documentElement.dataset.theme = 'light' }
    })()
  </script>
  <script src="https://cdn.tailwindcss.com"></script>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&display=swap" rel="stylesheet" charset="utf-8">
  <link rel="stylesheet" href="../css/estilo.css">
  <script>
    tailwind.config = {
      theme: {
        extend: {
          fontFamily: { sans: ['Inter', 'ui-sans-serif', 'system-ui'] }
        }
      }
    }
  </script>
</head>
<body>

  <div id="navbar"></div>

  <main class="app-main">
    <div class="app-container">

      <!-- Skeleton durante o carregamento (RNF2) -->
      <div id="detalheSkeleton" style="padding-top:2rem;display:grid;gap:1rem">
        <div class="skeleton" style="width:6rem"></div>
        <div class="skeleton" style="width:66%;height:2.5rem"></div>
        <div class="skeleton" style="width:50%"></div>
        <div class="skeleton" style="width:33%"></div>
      </div>

      <section id="cabecalhoCurso" class="app-card" style="margin-top:1.5rem" hidden></section>

      <section id="conteudoDetalhe" style="margin-top:2.5rem" hidden>
        <div class="app-card" role="tablist" aria-label="Informações do curso" data-i18n-aria-label="detalhes.abasAria" aria-orientation="horizontal" style="border-radius:20px 20px 0 0;padding:.5rem">
<div class="barra-guias">
           <button type="button" role="tab" aria-selected="true" aria-controls="atmNotas" id="guia-notas"
               class="guia" data-track-secao="notas" data-i18n="detalhes.abaNotas">Notas de corte</button>
            <button type="button" role="tab" aria-selected="false" aria-controls="atmCustos" id="guia-custos" tabindex="-1"
               class="guia" data-track-secao="custos" data-i18n="detalhes.abaCustos">Custos da cidade</button>
            <button type="button" role="tab" aria-selected="false" aria-controls="atmBolsas" id="guia-bolsas" tabindex="-1"
               class="guia" data-track-secao="bolsas" data-i18n="detalhes.abaBolsas">Bolsas e auxílios</button>
            <button type="button" role="tab" aria-selected="false" aria-controls="atmMercado" id="guia-mercado" tabindex="-1"
               class="guia" data-track-secao="mercado" data-i18n="detalhes.abaMercado">Mercado e estágios</button>
            <button type="button" role="tab" aria-selected="false" aria-controls="atmCursos" id="guia-cursos" tabindex="-1"
               class="guia" data-track-secao="geral" data-i18n="detalhes.abaCursos">Cursos da instituição</button>
         </div>
        </div>

        <div class="app-card" style="border-radius:0 0 20px 20px;box-shadow:none">
<section id="atmNotas" role="tabpanel" aria-labelledby="guia-notas"></section>
           <section id="atmCustos" role="tabpanel" aria-labelledby="guia-custos" hidden></section>
           <section id="atmBolsas" role="tabpanel" aria-labelledby="guia-bolsas" hidden></section>
           <section id="atmMercado" role="tabpanel" aria-labelledby="guia-mercado" hidden></section>
           <section id="atmCursos" role="tabpanel" aria-labelledby="guia-cursos" hidden></section>
        </div>
      </section>

    </div>
  </main>

  <footer class="app-footer">
    <p data-i18n="comum.rodapeProjeto">© 2026 Ingresso Universitário — Projeto Integrador I · Grupo 3</p>
  </footer>

  <div id="toast" role="status" aria-live="polite"></div>

  <script src="../js/traducoes.js?v=3"></script>
  <script src="../js/i18n.js?v=3"></script>
  <script src="../js/seletor-idioma.js?v=3"></script>
  <script src="../js/util.js?v=4"></script>
  <script src="../js/api.js?v=3"></script>
  <script src="../js/dadosDemo.js?v=2"></script>
  <script src="../js/componentes.js?v=4"></script>
  <script src="../js/favoritos.js?v=3"></script>
  <script src="../js/admin-integrado.js?v=1"></script>
  <script src="../js/detalhes.js?v=7"></script>
</body>
</html>
