<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
  <meta name="theme-color" content="#143f8f">
  <meta name="description" content="Sua lista de cursos e universidades favoritos para acesso rápido." data-i18n-content="meta.favoritos.descricao">
  <title data-i18n="meta.favoritos.titulo">Favoritos — Ingresso Universitário</title>
  <script>
    (function () {
      try {
        var tema = localStorage.getItem('ingresso_tema')
        if (!tema) tema = window.matchMedia('(prefers-color-scheme: dark)').matches ? 'dark' : 'light'
        document.documentElement.dataset.theme = tema
      } catch (erro) { document.documentElement.dataset.theme = 'light' }
    })()
  </script>
  <script src="https://cdn.tailwindcss.com"></script>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&display=swap" rel="stylesheet" charset="utf-8">
  <link rel="stylesheet" href="../css/estilo.css">
  <script>
    tailwind.config = {
      theme: {
        extend: {
          fontFamily: { sans: ['Inter', 'ui-sans-serif', 'system-ui'] }
        }
      }
    }
  </script>
</head>
<body>

  <div id="navbar"></div>

  <main class="app-main">
    <div class="app-container">
      <section>
        <div class="section-heading">
          <div>
            <h1 data-i18n="favoritos.titulo">Meus favoritos</h1>
            <p data-i18n="favoritos.descricao">Acesso rápido aos cursos e universidades que você salvou.</p>
          </div>
          <p id="resumoFavoritos" aria-live="polite"></p>
        </div>
        <div id="areaFavoritos" class="resultados-grid"></div>
      </section>
    </div>
  </main>

  <footer class="app-footer">
    <p data-i18n="comum.rodapeProjeto">© 2026 Ingresso Universitário — Projeto Integrador I · Grupo 3</p>
  </footer>

  <div id="toast" role="status" aria-live="polite"></div>

  <script src="../js/traducoes.js?v=3"></script>
  <script src="../js/i18n.js?v=3"></script>
  <script src="../js/seletor-idioma.js?v=3"></script>
  <script src="../js/util.js?v=4"></script>
  <script src="../js/api.js?v=3"></script>
  <script src="../js/dadosDemo.js?v=2"></script>
  <script src="../js/componentes.js?v=4"></script>
  <script src="../js/favoritos.js?v=4"></script>
  <script src="../js/admin-integrado.js?v=1"></script>
</body>
</html>
